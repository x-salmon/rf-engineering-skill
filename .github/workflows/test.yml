name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
        extras: ["none", "full"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional extras
        if: matrix.extras == 'full'
        run: pip install -r requirements-optional.txt
      - name: Run tests (stdlib-only run proves no hidden dependencies)
        run: python -W ignore -m unittest discover tests -v
